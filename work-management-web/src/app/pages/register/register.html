<div class="register-card">
  <div class="register-header">
    <h2>Create Account</h2>
  </div>

  <form (ngSubmit)="register()" class="register-form">
    <div class="form-group">
      <label>Username</label>
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        required
        placeholder="Enter your username"
      />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="Enter your email"
      />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Enter password"
      />
    </div>
    @if (errorMessage()) {
      <div class="error-message">
        {{ errorMessage() }}
      </div>
    }

    <button type="submit" class="register-btn" [disabled]="!username || !email || !password">
      Register
    </button>
  </form>
</div>
