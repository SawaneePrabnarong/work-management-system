@if (project$ | async; as project) {
  <div class="project-detail">
    <div class="top-bar">
      <button class="back-btn" (click)="goBack()">← Back</button>

      <div class="actions">
        <button (click)="startEdit(project)">Edit</button>
        <button class="danger" (click)="deleteProject(project.id)">Delete</button>
      </div>
    </div>

    <!-- NAME -->
    @if (!editing) {
      <h2>{{ project.name }}</h2>
    } @else {
      <input [(ngModel)]="editName" />
    }

    <!-- DESCRIPTION -->
    @if (!editing) {
      <p>{{ project.description || 'No description' }}</p>
    } @else {
      <textarea [(ngModel)]="editDescription"></textarea>

      <div class="edit-actions">
        <button (click)="saveProject(project)">Save</button>
        <button (click)="cancelEdit()">Cancel</button>
      </div>
    }
  </div>
} @else {
  <p>Loading project...</p>
}
